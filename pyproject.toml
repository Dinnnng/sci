[project]
name = "sci-topic-agent"
version = "0.1.0"
description = "Research topic selection agent powered by LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.1.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
